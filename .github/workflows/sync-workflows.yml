name: Sync workflow documentation

on:
  push:
    branches: [main]
    paths:
      - docs/workflows/examples.json
      - docs/workflows/site-feed.json
      - tools/render_workflow_examples.mjs
      - tests/workflow_examples.test.mjs
      - README.md
      - .github/workflows/sync-workflows.yml
  pull_request:
    paths:
      - docs/workflows/examples.json
      - docs/workflows/site-feed.json
      - tools/render_workflow_examples.mjs
      - tests/workflow_examples.test.mjs
      - README.md
      - .github/workflows/sync-workflows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.1'
      - run: bun test tests/workflow_examples.test.mjs
      - run: bun tools/render_workflow_examples.mjs --check

  sync:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.1'
      - name: Generate and validate matching documentation
        run: |
          bun test tests/workflow_examples.test.mjs
          bun tools/render_workflow_examples.mjs
          bun tools/render_workflow_examples.mjs --check
          git diff --check
      - name: Commit generated documentation when changed
        run: |
          git add README.md docs/workflows/site-feed.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync workflow README and site feed'
          git push origin HEAD:main
